name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install nftables syntax checker
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Test
        run: go test ./...
      - name: Validate generated nftables rules
        run: sudo env "PATH=$PATH" TAF_NFT_SYNTAX_CHECK=1 go test -run TestGeneratedFirewallConfigPassesNftCheckWhenAvailable -v .
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
